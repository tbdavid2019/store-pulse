<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="搜尋與比較連鎖店面的 Google Maps 評價，快速掌握各分店顧客回饋與營運深度洞察">
  <title>Store Pulse 店面脈搏 - 多店面評價速查與營運深度分析</title>
  
  <!-- PWA 支援 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#17324d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Store Pulse">
  
  <!-- 圖標 -->
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://store-pulse.oobwei.workers.dev">
  <meta property="og:title" content="Store Pulse 店面脈搏">
  <meta property="og:description" content="搜尋與比較連鎖店面的 Google Maps 評價，快速掌握各分店顧客回饋與營運深度洞察">
  <meta property="og:image" content="icons/icon-512x512.png">
  
  <!-- Fonts: JetBrains Mono & Noto Sans TC / Gen Jyuu Gothic & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "Gen Jyuu Gothic";
      src:
        local("Gen Jyuu Gothic"),
        local("源柔黑體"),
        url("https://cdn.jsdelivr.net/npm/@fontsource/genjyuu-gothic/files/genjyuu-gothic-latin-400-normal.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      /* 2md.aiurl.tw Editorial Palette */
      --saffron: #ffb010;
      --saffron-hover: #f2a600;
      --saffron-light: #fff0cc;
      --deep-blue: #17324d;
      --deep-blue-hover: #0f2337;
      --clay: #a9471d;
      --clay-light: #fef0eb;
      --clay-border: #f8c2b0;
      --warm-cream: #fff9e8;
      --ink: #2b251a;
      --canvas: #fff0cc;
      
      --primary: var(--saffron);
      --primary-hover: var(--saffron-hover);
      --primary-light: var(--saffron-light);
      --link: var(--deep-blue);
      --bg: var(--canvas);
      --card-bg: var(--warm-cream);
      --card-border: #ddc58b;
      --card-border-subtle: #ebd9af;
      --text: var(--ink);
      --text-muted: #655a43;
      --input-bg: #fffefa;
      --input-border: #6b5b38;
      
      --radius-sm: 8px;
      --radius: 16px;
      --radius-lg: 20px;
      
      --font-sans: "Gen Jyuu Gothic", "源柔黑體", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-display: "Outfit", var(--font-sans);
    }

    .jetbrains-mono {
      font-family: var(--font-mono);
      font-optical-sizing: auto;
      font-style: normal;
      font-variant-numeric: tabular-nums;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--saffron);
      color: var(--deep-blue);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--canvas);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    body {
      font-family: var(--font-sans);
      font-size: 18px;
      line-height: 1.7;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 5rem;
    }

    /* Header: 2md.aiurl.tw brand presentation */
    header.hero-header {
      position: relative;
      isolation: isolate;
      background: var(--primary);
      border-bottom: 2px solid var(--text);
      padding: 24px 0 26px;
      box-shadow: 0 4px 16px rgba(150, 98, 0, 0.15);
    }

    .header-inner {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      font-family: var(--font-display);
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 86px;
      min-height: 66px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--primary);
      border: 2.5px solid var(--deep-blue);
      color: var(--ink);
      letter-spacing: -0.025em;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .logo-main {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .logo-sub {
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .brand-text h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--deep-blue);
      letter-spacing: -0.02em;
      line-height: 1.22;
    }

    .brand-text p {
      font-size: 1.05rem;
      color: var(--ink);
      margin-top: 4px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* Main Layout (Flattened - no outer card wrapper) */
    main.main-layout {
      width: min(1160px, calc(100% - 32px));
      margin: 28px auto 0;
      padding: 0;
    }

    /* Search Bar Panel */
    .search-panel {
      margin-bottom: 22px;
    }

    .search-form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input-wrapper input {
      width: 100%;
      height: 54px;
      padding: 0 20px 0 54px;
      font-family: var(--font-sans);
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--text);
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    .search-input-wrapper input:focus {
      border-color: var(--deep-blue);
      box-shadow: 0 0 0 3.5px rgba(23, 50, 77, 0.18);
    }

    .search-input-wrapper input::placeholder {
      color: var(--text-muted);
      opacity: 0.95;
    }

    .search-icon-hint {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .btn-search {
      height: 54px;
      padding: 0 32px;
      background: var(--deep-blue);
      color: var(--warm-cream);
      font-family: var(--font-sans);
      font-size: 1.15rem;
      font-weight: 700;
      border: 2px solid var(--deep-blue);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.18s ease;
      box-shadow: 0 4px 12px rgba(23, 50, 77, 0.25);
      white-space: nowrap;
    }

    .btn-search:hover {
      background: var(--primary);
      border-color: var(--deep-blue);
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(255, 176, 16, 0.4);
      transform: translateY(-1px);
    }

    .btn-search:active {
      transform: scale(0.98);
    }

    /* Google Map */
    #map {
      height: 420px;
      border-radius: var(--radius);
      border: 2px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(79, 58, 14, 0.08);
      margin-bottom: 30px;
      background: var(--card-bg);
    }

    /* Results Header */
    #results {
      margin-top: 10px;
    }

    .results-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.4rem;
      border-bottom: 2px solid var(--card-border);
      padding-bottom: 0.9rem;
    }

    .results-heading-row h2 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--deep-blue);
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.01em;
    }

    .results-count-label {
      font-family: var(--font-mono);
      font-size: 1.02rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Store Grid & Cards */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-top: 1.2rem;
    }

    @media (max-width: 1060px) {
      .store-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 720px) {
      .store-grid { grid-template-columns: 1fr; }
    }

    .store-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 6px 20px rgba(79, 58, 14, 0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
    }

    .store-card:hover, .store-card.active {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(23, 50, 77, 0.16);
      border-color: var(--deep-blue);
    }

    .store-header {
      margin-bottom: 1rem;
    }

    .store-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--deep-blue);
      margin-bottom: 0.6rem;
      line-height: 1.35;
      letter-spacing: -0.015em;
      word-break: break-word;
    }

    .store-meta-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 0.6rem;
    }

    .rating-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
      color: #92400e;
      background: var(--primary-light);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 3px 10px;
    }

    .reviews-total-text {
      font-family: var(--font-mono);
      font-size: 0.98rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .distance-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--deep-blue);
      background: #eef5fb;
      border: 1.5px solid #bdd7ee;
      border-radius: var(--radius-sm);
      padding: 3px 10px;
      font-weight: 700;
    }

    .store-address {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 6px;
    }

    .store-address svg {
      flex-shrink: 0;
      margin-top: 3px;
      color: var(--clay);
    }

    .store-address a {
      color: var(--deep-blue);
      font-weight: 700;
      text-decoration: underline;
      word-break: break-all;
      transition: color 0.15s ease;
    }
    .store-address a:hover {
      color: var(--clay);
    }

    /* Reviews Section (Flattened - no nested card borders) */
    .reviews-section {
      margin-top: 1.1rem;
      border-top: 1.5px solid var(--card-border-subtle);
      padding-top: 1rem;
      flex: 1;
    }

    .reviews-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }

    .reviews-header-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--deep-blue);
      letter-spacing: 0.02em;
    }

    .reviews-header-count {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .reviews-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 5px;
      display: flex;
      flex-direction: column;
    }

    .review-item {
      font-size: 1.05rem;
      line-height: 1.7;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border-subtle);
      color: var(--text);
    }

    .review-item:last-child {
      border-bottom: none;
    }

    .review-item.is-low {
      border-left: 3.5px solid var(--clay);
      padding-left: 12px;
      margin: 4px 0;
      background: rgba(169, 71, 29, 0.05);
      border-radius: 0 6px 6px 0;
    }

    .review-author-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .review-author {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-meta-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .review-time {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .rating-pill {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .rating-pill-high {
      color: #92400e;
      background: var(--primary-light);
      border: 1px solid var(--primary);
    }

    .rating-pill-low {
      color: var(--clay);
      background: #fde8e1;
      border: 1px solid var(--clay-border);
    }

    .review-body {
      font-size: 1.02rem;
      line-height: 1.68;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Card Reviews Preview */
    .card-reviews-preview {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border-subtle);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .reviews-preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .preview-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--deep-blue);
    }

    .preview-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .preview-snippets {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .snippet-item {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--text);
      padding: 6px 0;
      border-bottom: 1px solid var(--card-border-subtle);
    }

    .snippet-item:last-child {
      border-bottom: none;
    }

    .snippet-item.is-low {
      border-left: 3px solid var(--clay);
      padding-left: 8px;
      background: rgba(169, 71, 29, 0.04);
      border-radius: 0 4px 4px 0;
    }

    .snippet-author-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .snippet-author {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink);
    }

    .snippet-text {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Store Card Open Drawer Button */
    .btn-open-analysis {
      margin-top: 16px;
      width: 100%;
      height: 48px;
      background: var(--deep-blue);
      color: var(--warm-cream);
      font-family: var(--font-sans);
      font-size: 1.05rem;
      font-weight: 700;
      border: 2px solid var(--deep-blue);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
      box-shadow: 0 3px 8px rgba(23, 50, 77, 0.2);
    }

    .btn-open-analysis:hover {
      background: var(--primary);
      border-color: var(--deep-blue);
      color: var(--ink);
      box-shadow: 0 4px 14px rgba(255, 176, 16, 0.4);
      transform: translateY(-1px);
    }

    .btn-open-analysis .btn-arrow {
      font-size: 1.15rem;
      transition: transform 0.18s ease;
    }

    .btn-open-analysis:hover .btn-arrow {
      transform: translateX(4px);
    }

    /* Slide-Over Analysis Drawer ("頁中頁" 側滑抽屜) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(23, 50, 77, 0.48);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1040;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .drawer-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .analysis-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(720px, 94vw);
      height: 100vh;
      background: var(--card-bg);
      border-left: 2px solid var(--card-border);
      box-shadow: -8px 0 36px rgba(23, 50, 77, 0.25);
      z-index: 1050;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .analysis-drawer.is-open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 20px 26px;
      background: var(--canvas);
      border-bottom: 2px solid var(--card-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .drawer-header-left {
      min-width: 0;
    }

    .drawer-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .drawer-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--deep-blue);
      line-height: 1.25;
      letter-spacing: -0.015em;
      word-break: break-word;
    }

    .drawer-address {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .drawer-address svg {
      flex-shrink: 0;
      color: var(--clay);
    }

    .drawer-address a {
      color: var(--deep-blue);
      font-weight: 700;
      text-decoration: underline;
      transition: color 0.15s ease;
    }
    .drawer-address a:hover {
      color: var(--clay);
    }

    .drawer-close-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--deep-blue);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .drawer-close-btn:hover {
      background: var(--primary);
      border-color: var(--deep-blue);
      color: var(--ink);
      transform: scale(1.06);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 48px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .drawer-controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 14px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--card-border-subtle);
    }

    .drawer-controls-group {
      display: flex;
      flex: 1;
      gap: 12px;
      min-width: 280px;
    }

    .drawer-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .drawer-field-label {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .drawer-select {
      height: 46px;
      padding: 0 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: var(--font-sans);

    /* Loader Overlay */

      margin: 0 auto 1.1rem;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header class="hero-header">
    <div class="header-inner">
      <div class="brand-row">
        <div class="brand-logo">
          <span class="logo-main">888</span>
          <span class="logo-sub">PULSE</span>
        </div>
        <div class="brand-text">
          <h1>Store Pulse 店面脈搏</h1>

  </header>

  <div id="loader" class="loader-overlay" style="display: none;">
    <div class="loader-content">
      <div class="spinner"></div>

  <main class="main-layout">
    <div class="search-panel">
      <form id="searchForm" onsubmit="event.preventDefault(); searchStores();" class="search-form">
        <div class="search-input-wrapper">
          <span class="search-icon-hint" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input id="searchQuery" type="text" placeholder="輸入品牌或店名（例：麥當勞、藏壽司、星巴克）" aria-label="搜尋店家名稱" autofocus>
        </div>
        <button class="btn-search" type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>搜尋分店</span>
        </button>
      </form>
    </div>

    <div id="mapNotice" style="display: none;"></div>
    <div id="map"></div>

    <section id="results">
      <div class="results-heading-row">
        <h2>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--deep-blue);">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          分店評價列表
        </h2>
        <span class="results-count-label" id="resultsCount">請輸入店家名稱開始搜尋</span>
      </div>
      <div class="store-grid" id="restaurantCards">
        <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 3rem 0; font-size: 1.15rem; font-weight: 600;">請在上方搜尋列輸入品牌名稱開始比對各分店評價。</p>
      </div>
    </section>
  </main>

  <!-- Slide-Over Analysis Drawer ("頁中頁" 側滑抽屜) -->
  <div id="drawerBackdrop" class="drawer-backdrop" onclick="closeAnalysisDrawer()" hidden></div>
  <aside id="analysisDrawer" class="analysis-drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
    <div class="drawer-header">
      <div class="drawer-header-left">
        <div class="drawer-badge-row">
          <span id="drawerRating" class="rating-badge jetbrains-mono">⭐ —</span>
          <span id="drawerReviewsCount" class="reviews-total-text jetbrains-mono">(0 則評論)</span>
          <span id="drawerDistance" class="distance-badge jetbrains-mono" style="display:none;">📏 — km</span>
        </div>
        <h2 id="drawerTitle" class="drawer-title">分店名稱</h2>
        <div class="drawer-address">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <a id="drawerMapsLink" href="#" target="_blank" rel="noopener noreferrer">在 Google 地圖上查看 ↗</a>
        </div>
      </div>
      <button type="button" class="drawer-close-btn" onclick="closeAnalysisDrawer()" aria-label="關閉分析面板">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="drawer-body">
      <!-- Controls Bar in Drawer -->
      <div class="drawer-controls-bar">
        <div class="drawer-controls-group">
          <div class="drawer-field">
            <label class="drawer-field-label">分析模式</label>
            <select id="drawerAnalysisMode" class="drawer-select">
              <option value="recent">近期評論</option>
              <option value="low_rating">低分評論（3 星以下）</option>
            </select>
          </div>
          <div class="drawer-field">
            <label class="drawer-field-label">分析期間</label>
            <select id="drawerAnalysisWindow" class="drawer-select">
              <option value="3650" selected>全部評論（不限時間）</option>
              <option value="90">近 90 天</option>
              <option value="30">近 30 天</option>
              <option value="180">近 180 天</option>
              <option value="365">近 1 年</option>
            </select>
          </div>
        </div>
        <button type="button" id="drawerAnalyzeBtn" class="drawer-action-btn" onclick="triggerDrawerAnalysis()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>即時深度診斷</span>
        </button>
      </div>

      <!-- Analysis Output in Drawer -->
      <div id="drawerOutput" class="drawer-output"></div>

      <!-- Full Reviews Section in Drawer -->
      <div class="drawer-reviews-section">
        <div class="drawer-section-heading">
          <span>Google Maps 顧客評論摘錄</span>
          <span id="drawerReviewsTabCount" class="jetbrains-mono" style="font-size:0.95rem;color:var(--text-muted);font-weight:600;">共 0 則</span>
        </div>
        <div id="drawerReviewsList"></div>
      </div>
    </div>
  </aside>

  <script>
    let map, geocoder, placesService;
    const markers = [];
    const markerMap = new Map();
    let activeInfoWindow = null;
    let userLocation = null;

    const EARTH_RADIUS_METERS = 6371000;

    // 網頁一打開，游標自動聚焦在搜尋輸入窗
    window.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('searchQuery');
      if (input) {
        input.focus();
        input.select?.();
      }
    });

    function toRadians(degrees) {
      return degrees * (Math.PI / 180);
    }

    function calculateDistanceMeters(origin, destination) {
      if (!origin || !destination) {
        return Number.POSITIVE_INFINITY;
      }

      const lat1 = origin.lat;
      const lng1 = origin.lng;
      const lat2 = typeof destination.lat === 'function' ? destination.lat() : destination.lat;
      const lng2 = typeof destination.lng === 'function' ? destination.lng() : destination.lng;

      if ([lat1, lng1, lat2, lng2].some(value => typeof value !== 'number')) {
        return Number.POSITIVE_INFINITY;
      }

      const dLat = toRadians(lat2 - lat1);
      const dLng = toRadians(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return EARTH_RADIUS_METERS * c;
    }

    function initMap() {
      const defaultLoc = { lat: 25.0330, lng: 121.5654 }; // 預設台北市中心
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: defaultLoc,
        mapTypeControl: false,
        streetViewControl: false
      });
      geocoder = new google.maps.Geocoder();
      placesService = new google.maps.places.PlacesService(map);

      map.addListener('click', () => {
        if (activeInfoWindow) {
          activeInfoWindow.close();
          activeInfoWindow = null;
        }
        document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
      });

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          map.setCenter(userLocation);
          map.setZoom(15);
          new google.maps.Marker({ map, position: userLocation, icon: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png', title: '您的位置' });
        }, () => {
          console.log("使用者未授權提供 GPS 位置。");
        }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 300000
        });
      }
    }

    function showGmapsErrorNotice(customMsg) {
      const banner = document.getElementById("mapNotice");
      if (!banner) return;
      banner.style.display = "block";
      const currentOrigin = window.location.origin;
      const customKey = localStorage.getItem('CUSTOM_GMAPS_KEY');
      banner.innerHTML = `
        <div style="background:var(--clay-light);border:1.5px solid var(--clay-border);border-radius:12px;padding:16px 18px;color:var(--clay);font-size:15px;line-height:1.65;margin-bottom:18px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <strong style="font-size:16px;color:var(--clay);font-weight:800;">⚠️ Google Maps 地圖載入失敗（HTTP 參照位址限制）</strong>
            <button onclick="document.getElementById('mapNotice').style.display='none'" style="background:transparent;border:none;color:var(--clay);cursor:pointer;font-size:18px;font-weight:700;">✕</button>
          </div>
          <p style="margin:6px 0;">${customMsg || '目前 Google Maps API Key 啟用了網域白名單限制，目前的網址尚未列入授權清單。'}</p>
          <div style="background:#fff;border:1px dashed var(--clay);padding:10px 14px;border-radius:8px;margin:10px 0;font-family:var(--font-mono);font-size:14px;word-break:break-all;color:var(--ink);">
            請至 Google Cloud Console 憑證設定將此網址加入白名單：<br>
            <strong style="color:var(--clay);">${currentOrigin}/*</strong>
          </div>
          <div style="display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap;">
            <button onclick="promptCustomKey()" style="background:var(--deep-blue);color:white;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;">更換自訂 Google Maps Key</button>
            ${customKey ? `<button onclick="resetCustomKey()" style="background:var(--text-muted);color:white;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;">重設為預設 Key</button>` : ''}
          </div>
        </div>
      `;
    }

    window.gm_authFailure = function() {
      console.warn("Google Maps JavaScript API 驗證失敗 (gm_authFailure)");
      showGmapsErrorNotice();
    };

    function promptCustomKey() {
      const currentKey = localStorage.getItem('CUSTOM_GMAPS_KEY') || '';
      const newKey = prompt('請輸入您的 Google Maps API Key（需啟用 Maps JavaScript API 與 Places API）：\n若留空則清除自訂 Key，還原為預設 Key。', currentKey);
      if (newKey !== null) {
        const trimmed = newKey.trim();
        if (trimmed) {
          localStorage.setItem('CUSTOM_GMAPS_KEY', trimmed);
        } else {
          localStorage.removeItem('CUSTOM_GMAPS_KEY');
        }
        window.location.reload();
      }
    }

    function resetCustomKey() {
      localStorage.removeItem('CUSTOM_GMAPS_KEY');
      window.location.reload();
    }

    function searchStores() {
      const query = document.getElementById("searchQuery").value;
      if (!query) return alert("請輸入店家名稱");

      if (!placesService) {
        showGmapsErrorNotice("無法搜尋：Google Maps 服務尚未就緒。請確認 Google Cloud Console 憑證已授權目前網址。");
        return;
      }

      analysisGeneration += 1;
      const searchGeneration = analysisGeneration;
      analysisControllers.forEach(controller => controller.abort());
      analysisControllers.clear();

      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      const container = document.getElementById("restaurantCards");
      container.innerHTML = "";
      markers.forEach(m => m.setMap(null));
      markers.length = 0;
      markerMap.clear();

      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }

      const request = {
        query: query,
        location: userLocation || new google.maps.LatLng(25.0330, 121.5654),
        radius: 40000,
        fields: ['name', 'geometry', 'place_id', 'rating', 'user_ratings_total', 'vicinity', 'url']
      };

      placesService.textSearch(request, (results, status) => {
        if (searchGeneration !== analysisGeneration) return;
        loader.style.display = 'none';
        
        if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length) {
          let processedResults = results.slice();

          if (userLocation) {
            processedResults.forEach(place => {
              place.distanceFromUser = calculateDistanceMeters(userLocation, place.geometry.location);
            });
            processedResults.sort((a, b) => (a.distanceFromUser || Infinity) - (b.distanceFromUser || Infinity));
          }

          const limitedResults = processedResults.slice(0, 10);
          const countEl = document.getElementById("resultsCount");
          if (countEl) countEl.textContent = `找到 ${limitedResults.length} 間相關分店`;

          if (userLocation) {
            map.setCenter(userLocation);
            map.setZoom(14);
          } else if (limitedResults.length > 0) {
            map.setCenter(limitedResults[0].geometry.location);
            map.setZoom(13);
          }

          limitedResults.forEach(place => {
            const detailsRequest = {
              placeId: place.place_id,
              fields: ['name', 'rating', 'user_ratings_total', 'vicinity', 'geometry', 'place_id', 'reviews', 'url']
            };

            placesService.getDetails(detailsRequest, (placeDetails, detailsStatus) => {
              if (searchGeneration !== analysisGeneration) return;
              if (detailsStatus === google.maps.places.PlacesServiceStatus.OK) {
                if (typeof place.distanceFromUser === 'number') {
                  placeDetails.distanceFromUser = place.distanceFromUser;
                }
                createMarker(placeDetails);
                createCard(placeDetails);
              }
            });
          });
        } else {
          container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 3rem 0; font-size: 1.15rem; font-weight: 600;">找不到符合條件的店家，請嘗試其他關鍵字。</p>`;
          const countEl = document.getElementById("resultsCount");
          if (countEl) countEl.textContent = `0 間結果`;
        }
      });
    }

    let currentDrawerPlace = null;
    let drawerAbortController = null;
    const ANALYSIS_API_BASE = window.STORE_PULSE_API_BASE || '';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(value || '', window.location.href);
        return /^https?:$/.test(url.protocol) ? url.href : '#';
      } catch (_) { return '#'; }
    }

    function createCard(place) {
        const container = document.getElementById("restaurantCards");
        const card = document.createElement("div");
        card.className = "store-card";
        card.dataset.placeId = place.place_id;

        let reviewsSnippetHtml = '';
        if (place.reviews && place.reviews.length > 0) {
            const snippetReviews = place.reviews.slice(0, 2);
            reviewsSnippetHtml = `
              <div class="card-reviews-preview">
                <div class="reviews-preview-header">
                  <span class="preview-title">最新顧客回饋</span>
                  <span class="preview-count jetbrains-mono">精選 ${snippetReviews.length}/${place.reviews.length} 則</span>
                </div>
                <div class="preview-snippets">
            `;
            snippetReviews.forEach(review => {
                const ratingNum = typeof review.rating === 'number' ? review.rating : null;
                const isLow = ratingNum !== null && ratingNum <= 3;
                const ratingPillClass = isLow ? 'rating-pill rating-pill-low' : 'rating-pill rating-pill-high';
                const ratingLabel = ratingNum !== null ? `⭐ ${ratingNum}` : '⭐ —';
                const previewText = review.text ? (review.text.length > 60 ? review.text.slice(0, 60) + '…' : review.text) : '（無文字評論）';

                reviewsSnippetHtml += `
                    <div class="snippet-item ${isLow ? 'is-low' : ''}">
                        <div class="snippet-author-row">
                          <span class="snippet-author">${escapeHtml(review.author_name || '匿名顧客')}</span>
                          <span class="${ratingPillClass} jetbrains-mono">${ratingLabel}</span>
                        </div>
                        <div class="snippet-text">${escapeHtml(previewText)}</div>
                    </div>
                `;
            });
            reviewsSnippetHtml += `</div></div>`;
        }

        const distanceBadge = typeof place.distanceFromUser === 'number'
            ? `<span class="distance-badge jetbrains-mono">📏 ${(place.distanceFromUser / 1000).toFixed(1)} km</span>`
            : '';

        card.innerHTML = `
            <div class="store-header">
              <h3 class="store-title">${escapeHtml(place.name || '未命名分店')}</h3>
              <div class="store-meta-row">
                <span class="rating-badge jetbrains-mono">⭐ ${place.rating || '—'}</span>
                <span class="reviews-total-text jetbrains-mono">(${place.user_ratings_total || 0} 則評論)</span>
                ${distanceBadge}
              </div>
              <div class="store-address">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                <a href="${safeHttpUrl(place.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(place.vicinity || '地址未提供')} ↗</a>
              </div>
            </div>
            ${reviewsSnippetHtml}
            <button type="button" class="btn-open-analysis">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
              </svg>
              <span>查看門市營運深度診斷</span>
              <span class="btn-arrow">➔</span>
            </button>
        `;

        const openBtn = card.querySelector('.btn-open-analysis');
        openBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openAnalysisDrawer(place);
        });

        card.onclick = () => {
            const marker = markerMap.get(place.place_id);
            if (marker) {
                google.maps.event.trigger(marker, 'click');
                document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            }
        };
        container.appendChild(card);
    }

    function openAnalysisDrawer(place) {
      currentDrawerPlace = place;

      // Populate Drawer Header
      document.getElementById('drawerTitle').textContent = place.name || '未命名分店';
      document.getElementById('drawerRating').textContent = `⭐ ${place.rating || '—'}`;
      document.getElementById('drawerReviewsCount').textContent = `(${place.user_ratings_total || 0} 則評論)`;
      
      const distEl = document.getElementById('drawerDistance');
      if (typeof place.distanceFromUser === 'number') {
        distEl.style.display = 'inline-flex';
        distEl.textContent = `📏 ${(place.distanceFromUser / 1000).toFixed(1)} km`;
      } else {
        distEl.style.display = 'none';
      }

      const mapsLink = document.getElementById('drawerMapsLink');
      mapsLink.href = safeHttpUrl(place.url);
      mapsLink.textContent = `${place.vicinity || '地址未提供'} ↗`;

      // Populate Original Reviews List in Drawer
      const reviewsList = document.getElementById('drawerReviewsList');
      reviewsList.replaceChildren();
      const reviews = place.reviews || [];
      document.getElementById('drawerReviewsTabCount').textContent = `共 ${reviews.length} 則`;

      if (reviews.length > 0) {
        reviews.forEach(review => {
          const item = document.createElement('div');
          const ratingNum = typeof review.rating === 'number' ? review.rating : null;
          const isLow = ratingNum !== null && ratingNum <= 3;
          item.className = isLow ? 'drawer-review-item is-low' : 'drawer-review-item';

          const ratingPillClass = isLow ? 'rating-pill rating-pill-low' : 'rating-pill rating-pill-high';
          const ratingLabel = ratingNum !== null ? `⭐ ${ratingNum}` : '⭐ —';
          const timeLabel = escapeHtml(review.relative_time_description || '');

          item.innerHTML = `
            <div class="review-author-row">
              <span class="review-author">${escapeHtml(review.author_name || '匿名顧客')}</span>
              <div class="review-meta-group">
                ${timeLabel ? `<span class="review-time">${timeLabel}</span>` : ''}
                <span class="${ratingPillClass} jetbrains-mono">${ratingLabel}</span>
              </div>
            </div>
            <div class="review-body">${escapeHtml(review.text || '')}</div>
          `;
          reviewsList.appendChild(item);
        });
      } else {
        reviewsList.innerHTML = `<p style="color:var(--text-muted);font-size:0.95rem;">此店家暫無詳細評論文字紀錄。</p>`;
      }

      // Open Drawer with Transition
      const backdrop = document.getElementById('drawerBackdrop');
      const drawer = document.getElementById('analysisDrawer');
      backdrop.hidden = false;
      drawer.hidden = false;
      requestAnimationFrame(() => {
        backdrop.classList.add('is-open');
        drawer.classList.add('is-open');
      });
      document.body.style.overflow = 'hidden';

      // Highlight Card and Marker
      const marker = markerMap.get(place.place_id);
      if (marker) {
        google.maps.event.trigger(marker, 'click');
      }
      document.querySelectorAll('.store-card').forEach(c => c.classList.remove('active'));
      const activeCard = document.querySelector(`.store-card[data-place-id="${place.place_id}"]`);
      if (activeCard) activeCard.classList.add('active');

      // Auto trigger analysis
      triggerDrawerAnalysis();
    }

    function closeAnalysisDrawer() {
      const backdrop = document.getElementById('drawerBackdrop');
      const drawer = document.getElementById('analysisDrawer');
      if (drawerAbortController) {
        drawerAbortController.abort();
        drawerAbortController = null;
      }
      backdrop.classList.remove('is-open');
      drawer.classList.remove('is-open');
      document.body.style.overflow = '';
      setTimeout(() => {
        backdrop.hidden = true;
        drawer.hidden = true;
      }, 280);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeAnalysisDrawer();
      }
    });

    function triggerDrawerAnalysis() {
      if (!currentDrawerPlace) return;
      const mode = document.getElementById('drawerAnalysisMode').value;
      const windowDays = Number(document.getElementById('drawerAnalysisWindow').value);
      requestDrawerAnalysis(currentDrawerPlace, mode, windowDays);
    }

    function requestDrawerAnalysis(place, mode, windowDays) {
      const btn = document.getElementById('drawerAnalyzeBtn');
      const output = document.getElementById('drawerOutput');
      if (drawerAbortController) {
        drawerAbortController.abort();
      }
      drawerAbortController = new AbortController();
      btn.disabled = true;
      output.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;color:var(--deep-blue);font-size:1.1rem;font-weight:700;padding:24px 0;">
          <span class="spinner" style="width:24px;height:24px;border-width:3px;margin:0;"></span>
          <span>正在進行門市營運深度診斷摘要…</span>
        </div>
      `;

      fetch(`${ANALYSIS_API_BASE}/api/review-analysis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          place_id: place.place_id,
          mode,
          window_days: windowDays,
          place: {
            place_id: place.place_id,
            name: place.name,
            address: place.vicinity || '',
            rating: place.rating || null,
            url: place.url || ''
          },
          reviews: (place.reviews || []).slice(0, 5).map(review => ({
            author_name: review.author_name,
            text: review.text,
            rating: review.rating,
            time: review.time,
            relative_time_description: review.relative_time_description,
            language: review.language
          }))
        }),
        signal: drawerAbortController.signal
      }).then(async response => {
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.message || payload.status || '分析服務暫時無法使用');
        return payload;
      }).then(payload => {
        renderDrawerAnalysis(payload);
      }).catch(error => {
        if (error.name === 'AbortError') return;
        output.innerHTML = `
          <div style="padding:16px 20px;background:var(--clay-light);border:1.5px solid var(--clay-border);border-radius:var(--radius-sm);color:var(--clay);font-size:1rem;line-height:1.65;">
            <strong>⚠️ 分析未完成：</strong>${escapeHtml(error.message)}。下方原有 Google Maps 評論仍可正常查閱。
          </div>
        `;
      }).finally(() => {
        btn.disabled = false;
        drawerAbortController = null;
      });
    }

    function renderDrawerAnalysis(payload) {
      const output = document.getElementById('drawerOutput');
      output.replaceChildren();

      const title = document.createElement('div');
      title.className = 'drawer-output-title';
      title.innerHTML = `
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--deep-blue);">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        <span>${payload.status === 'success' ? '門市營運深度分析報告' : (payload.status === 'insufficient_evidence' ? '目前設定區間無符合評論' : '評論已取得，摘要暫不可用')}</span>
      `;
      output.appendChild(title);

      const sampling = payload.sampling || {};
      const meta = document.createElement('div');
      meta.className = 'drawer-meta-bar';
      const excluded = sampling.excluded || {};
      const excludedCount = Object.values(excluded).reduce((sum, value) => sum + Number(value || 0), 0);
      const windowLabel = Number(sampling.window_days) >= 3650 ? '全部評論（不限時間）' : `近 ${sampling.window_days || '—'} 天`;
      meta.textContent = `樣本：使用 ${sampling.used || 0} / 符合 ${sampling.eligible || 0} / 擷取 ${sampling.fetched || 0} 則 | 排除 ${excludedCount} 則 | ${sampling.mode === 'low_rating' ? '低分評論' : '近期評論'} | ${windowLabel}${sampling.truncated ? ' | 上限' : ''}${payload.cache?.hit ? ' | 快取' : ''}`;
      output.appendChild(meta);

      const categoryNames = {
        service: '💁 服務態度',
        wait_time: '⏱️ 出餐速度',
        product_quality: '🍔 餐點品質',
        environment: '🌿 環境整潔',
        price: '💰 性價比'
      };

      const observations = payload.summary && Array.isArray(payload.summary.observations) ? payload.summary.observations : [];
      observations.forEach(observation => {
        const row = document.createElement('div');
        row.className = 'drawer-observation-card';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'drawer-observation-header';

        const badge = document.createElement('span');
        badge.className = 'category-badge';
        badge.textContent = categoryNames[observation.category] || observation.category;
        headerDiv.appendChild(badge);

        const findingSpan = document.createElement('span');
        findingSpan.className = 'drawer-observation-finding';
        findingSpan.textContent = observation.finding;
        headerDiv.appendChild(findingSpan);
        row.appendChild(headerDiv);

        if (observation.suggested_action) {
          const actionDiv = document.createElement('div');
          actionDiv.className = 'suggested-action-box';
          actionDiv.innerHTML = `
            <span style="flex-shrink:0;">💡</span>
            <span><strong>改善建議：</strong>${escapeHtml(observation.suggested_action)}</span>
          `;
          row.appendChild(actionDiv);
        }

        const matchedEvidences = (observation.evidence_ids || [])
          .map(id => (payload.evidence || []).find(item => item.evidence_id === id))
          .filter(Boolean);

        if (matchedEvidences.length > 0) {
          const detailsEl = document.createElement('details');
          detailsEl.className = 'evidence-details';

          const hoverText = matchedEvidences
            .map(e => `${e.author || '匿名顧客'} (${e.rating ? `⭐${e.rating}` : ''})：${e.text.length > 100 ? e.text.slice(0, 100) + '…' : e.text}`)
            .join('\n\n');

          const summaryEl = document.createElement('summary');
          summaryEl.className = 'evidence-summary';
          summaryEl.title = hoverText;
          summaryEl.innerHTML = `
            <span>💬 查閱佐證評論 (${matchedEvidences.length} 則)</span>
            <span class="evidence-toggle-arrow">▾</span>
          `;
          detailsEl.appendChild(summaryEl);

          const evidenceList = document.createElement('ul');
          evidenceList.className = 'evidence-list';

          matchedEvidences.forEach(evidence => {
            const item = document.createElement('li');
            item.className = 'evidence-item';
            const excerpt = evidence.is_excerpt ? '（節錄）' : '';

            const authorText = document.createElement('strong');
            authorText.textContent = `${evidence.author || '匿名顧客'} `;
            item.appendChild(authorText);

            const metaText = document.createElement('span');
            metaText.className = 'jetbrains-mono';
            metaText.style.fontSize = '0.92rem';
            metaText.style.color = '#92400e';
            metaText.textContent = `(⭐ ${evidence.rating ?? '—'}) `;
            item.appendChild(metaText);

            item.appendChild(document.createTextNode(`${excerpt}：${evidence.text} `));

            const sourceUrl = safeHttpUrl(evidence.source_url);
            if (sourceUrl !== '#') {
              const source = document.createElement('a');
              source.href = sourceUrl;
              source.target = '_blank';
              source.rel = 'noopener noreferrer';
              source.textContent = evidence.source_url_kind === 'review' ? '↗ 查閱評論' : '↗ 查閱店家';
              item.appendChild(source);
            }
            evidenceList.appendChild(item);
          });

          detailsEl.appendChild(evidenceList);
          row.appendChild(detailsEl);
        }
        output.appendChild(row);
      });

      (payload.signals || []).forEach(signal => {
        const note = document.createElement('div');
        note.className = 'drawer-meta-bar';
        note.style.borderLeft = '3.5px solid var(--primary)';
        note.textContent = `⚠️ 樣本訊號：評論中出現行銷誘因關鍵字（${signal.evidence_ids?.length || 0} 則），可能影響評分中立性。`;
        output.appendChild(note);
      });

      if (!observations.length) {
        const note = document.createElement('div');
        note.style.marginTop = '0.8rem';
        if (payload.status === 'insufficient_evidence') {
          note.innerHTML = `
            <p style="margin:0 0 6px 0;color:var(--clay);font-weight:700;font-size:1.08rem;">⚠️ 設定時間內符合條件之評論數為 0。</p>
            <p style="margin:0 0 10px 0;font-size:1rem;color:var(--text-muted);line-height:1.6;">Google Places API 每次預設僅提供 5 則精選評論。若評論發表時間較久，請直接切換為「全部評論」。</p>
            <button type="button" class="switch-all-btn" style="background:var(--deep-blue);color:var(--warm-cream);padding:8px 18px;font-size:1rem;border-radius:8px;border:none;cursor:pointer;font-weight:700;">切換為「全部評論」並立即分析</button>
          `;
          const switchBtn = note.querySelector('.switch-all-btn');
          if (switchBtn) {
            switchBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const winSel = document.getElementById('drawerAnalysisWindow');
              if (winSel) winSel.value = '3650';
              triggerDrawerAnalysis();
            });
          }
        } else {
          note.innerHTML = `
            <p style="margin:0 0 4px 0;font-weight:700;color:var(--ink);">${payload.status === 'timeout' ? '⏱️ 分析請求逾時，請稍後重試。' : (payload.usage?.summary_error ? `⚠️ 分析暫不可用（${payload.usage.summary_error}）` : '📋 已保留評論證據，模型摘要目前不可用。')}</p>
            <p style="margin:0;font-size:0.98rem;color:var(--text-muted);">下方原有評論資料仍可完整查閱。</p>
          `;
        }
        output.appendChild(note);
      }
    }

    function createMarker(place) {
        const marker = new google.maps.Marker({
            map,
            position: place.geometry.location,
            title: place.name
        });

        const distanceInfo = typeof place.distanceFromUser === 'number'
            ? `<br>距離：約 ${(place.distanceFromUser / 1000).toFixed(1)} 公里`
            : '';

        const infoWindowContent = `
            <div class="custom-infowindow">
                <strong>${escapeHtml(place.name || '未命名分店')}</strong>
                ⭐ ${escapeHtml(place.rating || 'N/A')} | 評論: ${escapeHtml(place.user_ratings_total || 0)}<br>
                <a href="${safeHttpUrl(place.url)}" target="_blank" rel="noopener">在 Google 地圖上查看</a>${distanceInfo}
            </div>
        `;

        const infoWindow = new google.maps.InfoWindow({
            content: infoWindowContent,
            ariaLabel: place.name,
        });

        marker.addListener("click", () => {
            if (activeInfoWindow) {
                activeInfoWindow.close();
            }
            infoWindow.open({
                anchor: marker,
                map,
            });
            activeInfoWindow = infoWindow;
            map.panTo(marker.getPosition());
        });

        markers.push(marker);
        markerMap.set(place.place_id, marker);
    }

    // 註冊 Service Worker (PWA 支援)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(registration => {
                    console.log('Service Worker 註冊成功:', registration);
                })
                .catch(error => {
                    console.log('Service Worker 註冊失敗:', error);
                });
        });
    }

    // 添加安裝提示
    let deferredPrompt;
    const installButton = document.createElement('button');
    installButton.textContent = '📱 安裝 App';
    installButton.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--deep-blue);
        color: var(--warm-cream);
        border: 2px solid var(--saffron);
        padding: 12px 22px;
        border-radius: 25px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(23, 50, 77, 0.35);
        display: none;
        z-index: 1000;
        font-family: inherit;
    `;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installButton.style.display = 'block';
        document.body.appendChild(installButton);
    });

    installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
            installButton.style.display = 'none';
        }
    });

    window.addEventListener('appinstalled', () => {
        console.log('PWA 已安裝成功');
        installButton.style.display = 'none';
    });

    (function loadGoogleMaps() {
      const customKey = localStorage.getItem('CUSTOM_GMAPS_KEY');
      const apiKey = customKey || 'AIzaSyB9zIkabAHoudMDAwbKom6URgjmUuejEpo';
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap&libraries=places,marker&v=weekly`;
      script.async = true;
      script.defer = true;
      script.onerror = function() {
        console.error("無法載入 Google Maps API 腳本");
        showGmapsErrorNotice("無法載入 Google Maps 腳本，請確認網路連線或檢查 API 金鑰。");
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
