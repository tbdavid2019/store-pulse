  <style>

    /* Loader styles */

      border-radius: 50%;

      animation: spin 1s linear infinite;

    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

<body>
  <header>
    <h2>🍽️ 多店面管理評價速查</h2>
    <p>輸入店名，即時掌握各分店評價</p>
  </header>

  <div id="loader" class="loader-overlay" style="display: none;">
    <div class="loader-content">
      <div class="spinner"></div>
      <p>正在搜尋，請稍候...</p>
    </div>
  </div>

  <div class="container">
    <div id="controls">
      <input id="searchQuery" type="text" placeholder="請輸入店家名稱（例：麥當勞）" style="flex:1;">
      <button onclick="searchStores()">搜尋</button>
    </div>

    <div id="map"></div>
    <div id="results">
      <h3>推薦店家</h3>
      <div class="card-container" id="restaurantCards">
        <p>請輸入地址開始搜尋附近餐廳</p>
      </div>
    </div>
  </div>

  <script>
    let map, geocoder, placesService; // 將 placesService 宣告在更廣的作用域
    const markers = [];
    const markerMap = new Map();
    let activeInfoWindow = null;
    let userLocation = null;

    const EARTH_RADIUS_METERS = 6371000;

    function toRadians(degrees) {
      return degrees * (Math.PI / 180);
    }

    function calculateDistanceMeters(origin, destination) {
      if (!origin || !destination) {
        return Number.POSITIVE_INFINITY;
      }

      const lat1 = origin.lat;
      const lng1 = origin.lng;
      const lat2 = typeof destination.lat === 'function' ? destination.lat() : destination.lat;
      const lng2 = typeof destination.lng === 'function' ? destination.lng() : destination.lng;

      if ([lat1, lng1, lat2, lng2].some(value => typeof value !== 'number')) {
        return Number.POSITIVE_INFINITY;
      }

      const dLat = toRadians(lat2 - lat1);
      const dLng = toRadians(lng2 - lng1);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
                Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return EARTH_RADIUS_METERS * c;
    }

    function initMap() {
      const defaultLoc = { lat: 25.0330, lng: 121.5654 }; // 預設台北市中心
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,
        center: defaultLoc
      });
      geocoder = new google.maps.Geocoder();
      placesService = new google.maps.places.PlacesService(map);

      // 頁面載入時請求 GPS 位置
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          map.setCenter(userLocation);
          map.setZoom(15);
          new google.maps.Marker({ map, position: userLocation, icon: 'https://maps.google.com/mapfiles/ms/icons/blue-dot.png', title: '您的位置' });
        }, () => {
          console.log("使用者拒絕提供位置資訊。");
        }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 300000
        });
      }

      // 讓使用者可以在輸入框中按下 Enter 鍵來觸發搜尋
      document.getElementById('searchQuery').addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault(); // 防止可能的表單提交行為
          searchStores();
        }
      });
    }

    function searchStores() {
      const query = document.getElementById("searchQuery").value;
      if (!query) return alert("請輸入店家名稱");
      analysisGeneration += 1;
      const searchGeneration = analysisGeneration;
      analysisControllers.forEach(controller => controller.abort());
      analysisControllers.clear();

      const loader = document.getElementById('loader');
      loader.style.display = 'flex';

      // 清除之前的結果
      const container = document.getElementById("restaurantCards");
      container.innerHTML = "";
      markers.forEach(m => m.setMap(null));
      markers.length = 0;
      markerMap.clear();

      if (activeInfoWindow) {
        activeInfoWindow.close();
        activeInfoWindow = null;
      }

      // 使用 Google Places Text Search
      const request = {
        query: query,
        location: userLocation || new google.maps.LatLng(25.0330, 121.5654),
        radius: 40000,
        fields: ['name', 'geometry', 'place_id', 'rating', 'user_ratings_total', 'vicinity', 'url']
      };

      placesService.textSearch(request, (results, status) => {
        if (searchGeneration !== analysisGeneration) return;
        loader.style.display = 'none';
        
        if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length) {
          let processedResults = results.slice();

          if (userLocation) {
            processedResults.forEach(place => {
              place.distanceFromUser = calculateDistanceMeters(userLocation, place.geometry.location);
            });
            processedResults.sort((a, b) => (a.distanceFromUser || Infinity) - (b.distanceFromUser || Infinity));
          }

          // 限制最多 10 個結果
          const limitedResults = processedResults.slice(0, 10);

          if (userLocation) {
            map.setCenter(userLocation);
            map.setZoom(14);
          } else if (limitedResults.length > 0) {
            map.setCenter(limitedResults[0].geometry.location);
            map.setZoom(13);
          }

          // 為每個結果獲取詳細信息（包含評論）
          limitedResults.forEach(place => {
            const detailsRequest = {
              placeId: place.place_id,
              fields: ['name', 'rating', 'user_ratings_total', 'vicinity', 'geometry', 'place_id', 'reviews', 'url']
            };

            placesService.getDetails(detailsRequest, (placeDetails, detailsStatus) => {
              if (searchGeneration !== analysisGeneration) return;
              if (detailsStatus === google.maps.places.PlacesServiceStatus.OK) {
                if (typeof place.distanceFromUser === 'number') {
                  placeDetails.distanceFromUser = place.distanceFromUser;
                }
                createMarker(placeDetails);
                createCard(placeDetails);
              }
            });
          });
        } else {
          container.innerHTML = "<p>找不到符合條件的店家。請嘗試其他關鍵字。</p>";
          console.log('Places service status:', status);
        }
      });
    }

    function createCard(place) {
        const container = document.getElementById("restaurantCards");
        const card = document.createElement("div");
        card.className = "card";

        let reviewsHtml = '';
        if (place.reviews && place.reviews.length > 0) {
            reviewsHtml = '<div class="reviews-container">';
            reviewsHtml += '<h5>評論摘錄：</h5>';
            reviewsHtml += '<ul>';
            place.reviews.forEach(review => {
                const ratingClass = review.rating <= 3 ? 'class="low-rating-review"' : '';
                reviewsHtml += `
                    <li ${ratingClass}>
                        <p><strong>${escapeHtml(review.author_name || '匿名使用者')}</strong> (⭐ ${review.rating || '—'})</p>
                        <p style="white-space: pre-wrap;">${escapeHtml(review.text || '')}</p>
                    </li>
                `;
            });
            reviewsHtml += '</ul></div>';
        }

        const distanceText = typeof place.distanceFromUser === 'number'
            ? `<p>📏 距離：約 ${(place.distanceFromUser / 1000).toFixed(1)} 公里</p>`
            : '';

        card.innerHTML = `
            <h4>${escapeHtml(place.name || '未命名分店')}</h4>
            <p>⭐ ${place.rating || '無評分'} (${place.user_ratings_total || 0} 則評論)</p>
            <p>📍 <a href="${safeHttpUrl(place.url)}" target="_blank" rel="noopener">${escapeHtml(place.vicinity || '地址未提供')}</a></p>
            ${distanceText}
            ${reviewsHtml}
        `;

        const analysisPanel = document.createElement('section');
        analysisPanel.className = 'analysis-panel';
        analysisPanel.setAttribute('aria-label', '分店深度分析');
        analysisPanel.innerHTML = `
          <div class="analysis-controls">
            <select aria-label="評論分析方式" class="analysis-mode">
              <option value="recent">近期評論</option>
              <option value="low_rating">低分評論（3 星以下）</option>
            </select>
            <select aria-label="評論分析期間" class="analysis-window">
              <option value="90">近 90 天</option>
              <option value="30">近 30 天</option>
            </select>
            <button type="button" class="analysis-button">深度分析</button>
          </div>
          <div class="analysis-output" hidden></div>
        `;
        card.appendChild(analysisPanel);
        const analysisButton = analysisPanel.querySelector('.analysis-button');
        analysisButton.addEventListener('click', event => {
          event.stopPropagation();
          requestBranchAnalysis(place, analysisPanel);
        });

        card.onclick = () => {
            const marker = markerMap.get(place.place_id);
            if (marker) {
                new google.maps.event.trigger(marker, 'click');
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            }
        };
        container.appendChild(card);
    }

    let analysisGeneration = 0;
    const ANALYSIS_API_BASE = window.STORE_PULSE_API_BASE || '';
    const analysisControllers = new Set();

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(value || '', window.location.href);
        return /^https?:$/.test(url.protocol) ? url.href : '#';
      } catch (_) { return '#'; }
    }

    function requestBranchAnalysis(place, panel) {
      const button = panel.querySelector('.analysis-button');
      const output = panel.querySelector('.analysis-output');
      const mode = panel.querySelector('.analysis-mode').value;
      const windowDays = Number(panel.querySelector('.analysis-window').value);
      const generation = analysisGeneration;
      const controller = new AbortController();
      analysisControllers.add(controller);
      button.disabled = true;
      output.hidden = false;
      output.textContent = '正在整理評論證據…';
      fetch(`${ANALYSIS_API_BASE}/api/review-analysis`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          place_id: place.place_id,
          mode,
          window_days: windowDays,
          place: {
            place_id: place.place_id,
            name: place.name,
            address: place.vicinity || '',
            rating: place.rating || null,
            url: place.url || ''
          },
          reviews: (place.reviews || []).slice(0, 5).map(review => ({
            author_name: review.author_name,
            text: review.text,
            rating: review.rating,
            time: review.time,
            relative_time_description: review.relative_time_description,
            language: review.language
          }))
        }),
        signal: controller.signal
      }).then(async response => {
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.message || payload.status || '分析服務暫時無法使用');
        return payload;
      }).then(payload => {
        if (generation !== analysisGeneration || !panel.isConnected) return;
        renderAnalysis(payload, panel);
      }).catch(error => {
        if (generation !== analysisGeneration || !panel.isConnected) return;
        output.textContent = !navigator.onLine || error instanceof TypeError
          ? '目前離線，連線恢復後可重新分析。'
          : `分析未完成：${error.message}。原有評論仍可查看。`;
      }).finally(() => {
        analysisControllers.delete(controller);
        if (generation === analysisGeneration && panel.isConnected) button.disabled = false;
      });
    }

    function renderAnalysis(payload, panel) {
      const output = panel.querySelector('.analysis-output');
      output.replaceChildren();
      const title = document.createElement('strong');
      title.textContent = payload.status === 'success' ? '營運摘要' : (payload.status === 'insufficient_evidence' ? '目前樣本不足' : '證據已取得，摘要暫不可用');
      output.appendChild(title);
      const sampling = payload.sampling || {};
      const meta = document.createElement('div');
      meta.className = 'analysis-meta';
      const excluded = sampling.excluded || {};
      const excludedCount = Object.values(excluded).reduce((sum, value) => sum + Number(value || 0), 0);
      meta.textContent = `樣本：使用 ${sampling.used || 0}／符合 ${sampling.eligible || 0}／擷取 ${sampling.fetched || 0} 則｜排除 ${excludedCount} 則｜${sampling.mode === 'low_rating' ? '低分評論' : '近期評論'}｜近 ${sampling.window_days || '—'} 天${sampling.truncated ? '｜已達擷取上限，樣本可能不完整' : ''}${payload.fetched_at ? `｜擷取 ${payload.fetched_at}` : ''}${payload.analyzed_at ? `｜分析 ${payload.analyzed_at}` : ''}${payload.cache?.hit ? '｜快取命中' : ''}`;
      output.appendChild(meta);
      const observations = payload.summary && Array.isArray(payload.summary.observations) ? payload.summary.observations : [];
      observations.forEach(observation => {
        const row = document.createElement('div');
        row.className = 'analysis-observation';
        const label = document.createElement('strong');
        label.textContent = `${observation.category}：`;
        row.appendChild(label);
        row.appendChild(document.createTextNode(observation.finding));
        if (observation.suggested_action) row.appendChild(document.createTextNode(` 建議：${observation.suggested_action}`));
        const evidenceList = document.createElement('ul');
        evidenceList.className = 'evidence-list';
        (observation.evidence_ids || []).forEach(id => {
          const evidence = (payload.evidence || []).find(item => item.evidence_id === id);
          if (!evidence) return;
          const item = document.createElement('li');
          const excerpt = evidence.is_excerpt ? '（節錄）' : '';
          item.appendChild(document.createTextNode(`${evidence.author || '匿名'}（${evidence.rating ?? '—'} 星，${evidence.published_at || '日期未知'}）${excerpt}：${evidence.text} `));
          const sourceUrl = safeHttpUrl(evidence.source_url);
          if (sourceUrl !== '#') {
            const source = document.createElement('a');
            source.href = sourceUrl;
            source.target = '_blank';
            source.rel = 'noopener noreferrer';
            source.textContent = evidence.source_url_kind === 'review' ? '查看原評論' : '查看店家';
            item.appendChild(source);
          } else {
            item.appendChild(document.createTextNode('來源連結未提供'));
          }
          evidenceList.appendChild(item);
        });
        row.appendChild(evidenceList);
        output.appendChild(row);
      });
      (payload.signals || []).forEach(signal => {
        const note = document.createElement('p');
        note.className = 'analysis-meta';
        note.textContent = `樣本訊號：評論中出現可能的誘因描述（${signal.evidence_ids?.length || 0} 則），請展開原文查證；這不代表評論已被證實造假。`;
        output.appendChild(note);
      });
      if (!observations.length) {
        const note = document.createElement('p');
        note.textContent = payload.status === 'insufficient_evidence'
          ? '符合條件的評論不足，請改用近 90 天或查看評論摘錄。'
          : payload.status === 'timeout'
            ? '分析逾時；目前取得的證據仍可供檢視，請稍後重試。'
            : '已保留評論證據，模型摘要目前不可用。';
        output.appendChild(note);
      }
    }

    function createMarker(place) {
        const marker = new google.maps.Marker({
            map,
            position: place.geometry.location,
            title: place.name
        });

        const distanceInfo = typeof place.distanceFromUser === 'number'
            ? `<br>距離：約 ${(place.distanceFromUser / 1000).toFixed(1)} 公里`
            : '';

        const infoWindowContent = `
            <div class="custom-infowindow">
                <strong>${escapeHtml(place.name || '未命名分店')}</strong><br>
                ⭐ ${escapeHtml(place.rating || 'N/A')} | 評論: ${escapeHtml(place.user_ratings_total || 0)}<br>
                <a href="${safeHttpUrl(place.url)}" target="_blank" rel="noopener">在 Google 地圖上查看</a>${distanceInfo}
            </div>
        `;

        const infoWindow = new google.maps.InfoWindow({
            content: infoWindowContent,
            ariaLabel: place.name,
        });

        marker.addListener("click", () => {
            if (activeInfoWindow) {
                activeInfoWindow.close();
            }
            infoWindow.open({
                anchor: marker,
                map,
            });
            activeInfoWindow = infoWindow;
            map.panTo(marker.getPosition());
        });

        markers.push(marker);
        markerMap.set(place.place_id, marker);
    }

    // 當用戶點擊地圖其他地方時，關閉 InfoWindow
    google.maps.event.addDomListener(map, 'click', () => {
        if (activeInfoWindow) {
            activeInfoWindow.close();
            activeInfoWindow = null;
        }
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    });

    // 註冊 Service Worker (PWA 支援)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('service-worker.js')
                .then(registration => {
                    console.log('Service Worker 註冊成功:', registration);
                })
                .catch(error => {
                    console.log('Service Worker 註冊失敗:', error);
                });
        });
    }

    // 添加安裝提示
    let deferredPrompt;
    const installButton = document.createElement('button');
    installButton.textContent = '📱 安裝 App';
    installButton.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #173b3f;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 25px;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        display: none;
        z-index: 1000;
        font-family: inherit;
    `;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installButton.style.display = 'block';
        document.body.appendChild(installButton);
    });

    installButton.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
            installButton.style.display = 'none';
        }
    });

    window.addEventListener('appinstalled', () => {
        console.log('PWA 已安裝成功');
        installButton.style.display = 'none';
    });

  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB9zIkabAHoudMDAwbKom6URgjmUuejEpo&callback=initMap&libraries=places,marker&v=weekly"></script>
</body>
</html>
